{% if !faqs.is_empty() %}
<section class="faq">
  <p class="kicker">Frequently asked</p>
  <h2>Answers before you ask.</h2>
  <div class="faq-list">
    {% for item in faqs %}
    <details><summary>{{ item.question }}</summary><p>{{ item.answer }}</p></details>
    {% endfor %}
  </div>
</section>
{% endif %}
