<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Admin{% endblock %} · Italy Developers</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#161616"><link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/site.css"><link rel="stylesheet" href="/static/admin.css"><script src="/static/admin.js" defer></script></head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="brand" href="/admin"><span class="flag"><i></i><i></i><i></i></span>Admin</a>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/admin/leads">Leads</a>
      <p class="admin-nav-label">Content</p>
      <a href="/admin/content/services">Services</a>
      <a href="/admin/content/work">Work</a>
      <a href="/admin/content/testimonials">Testimonials</a>
      <a href="/admin/content/team">Team</a>
      <a href="/admin/content/faqs">FAQs</a>
      <a href="/admin/content/insights">Insights</a>
      <p class="admin-nav-label">Studio</p>
      <a href="/admin/settings">Site settings</a>
      <a href="/admin/admins">Admin users</a>
    </nav>
    <div class="admin-sidebar-foot">
      <a class="text-link" href="/" target="_blank" rel="noopener">View site ↗</a>
      <form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="text-link" type="submit">Log out</button></form>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar"><h1>{% block heading %}{% endblock %}</h1><span>{{ username }}</span></header>
    <div class="admin-content">{% block content %}{% endblock %}</div>
  </main>
</div>
</body></html>
