<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Italy Developers</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#161616"><link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/site.css"><link rel="stylesheet" href="/static/admin.css"></head>
<body class="admin admin-login-body">
<main class="admin-login">
  <a class="brand" href="/"><span class="flag"><i></i><i></i><i></i></span>Italy Developers</a>
  <h1>Admin sign in</h1>
  {% if let Some(msg) = error %}<p class="admin-error">{{ msg }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username<input name="username" required autocomplete="username" autofocus></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="button wide" type="submit">Sign in <span>↗</span></button>
  </form>
</main>
</body></html>
