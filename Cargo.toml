[package]
name = "italy-developers-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
actix-files = "0.6"
actix-governor = "0.7"
actix-multipart = "0.7"
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-web = "=4.9.0"
anyhow = "1"
askama = "0.12"
bcrypt = "0.17"
constant_time_eq = "0.3"
dotenvy = "0.15"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
mongodb = "3.2"
sanitize-filename = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
validator = { version = "0.19", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
