services:
  db:
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-italy_developers}
    expose:
      - "27017"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/${MONGODB_DATABASE:-italy_developers}?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-italy_developers}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: "true"
      WEB_WORKERS: ${WEB_WORKERS:-2}
      RUST_LOG: ${RUST_LOG:-info,actix_web=info}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
