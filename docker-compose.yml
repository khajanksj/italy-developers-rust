services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: italy_developers
      POSTGRES_USER: italy
      POSTGRES_PASSWORD: local-development-only
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U italy -d italy_developers"], interval: 5s, timeout: 3s, retries: 10}
  web:
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://italy:local-development-only@db:5432/italy_developers
      APP_SECRET_KEY: local-development-key-change-before-production-00000000000000000000
      COOKIE_SECURE: "false"
      RUST_LOG: info
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes: {postgres_data: {}}
